<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-Model Chat AI</title>

    <!-- Tema dipasang sebelum halaman tampil, supaya tidak ada kedip -->
    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link rel="stylesheet" href="/static/css/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  </head>

  <body
    class="h-full m-0 bg-slate-100 text-slate-800 dark:bg-[#0f1115] dark:text-slate-200 font-sans"
  >
    <div class="flex h-full">
      <!-- Sidebar riwayat -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-30 w-72 md:w-64 -translate-x-full md:translate-x-0 md:static flex flex-col bg-white dark:bg-[#171a21] border-r border-slate-200 dark:border-slate-800 transition-transform duration-200"
      >
        <div class="p-3">
          <button
            id="newChat"
            type="button"
            class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 transition"
          >
            + Chat baru
          </button>
        </div>
        <div
          class="px-4 pb-1 text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400"
        >
          Riwayat
        </div>
        <nav
          id="convList"
          class="flex-1 overflow-y-auto px-2 pb-3 space-y-0.5"
        ></nav>
      </aside>

      <div
        id="overlay"
        class="fixed inset-0 bg-black/40 z-20 hidden md:hidden"
      ></div>

      <div class="flex-1 flex flex-col min-w-0 h-full">
        <header
          class="flex items-center justify-between gap-3 px-4 py-3 bg-white dark:bg-[#171a21] border-b border-slate-200 dark:border-slate-800"
        >
          <div class="flex items-center gap-2 min-w-0">
            <button
              id="menuBtn"
              type="button"
              aria-label="Buka riwayat"
              class="md:hidden p-2 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800"
            >
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M3 6h18M3 12h18M3 18h18" />
              </svg>
            </button>
            <h1 id="title" class="text-base font-semibold truncate">
              Chat baru
            </h1>
          </div>
          <div class="flex items-center gap-2">
            <!-- Dropdown model custom: nama + hint -->
            <div id="modelWrap" class="relative min-w-0">
              <button
                id="modelBtn"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
                class="flex items-center gap-2 max-w-[11rem] sm:max-w-[16rem] text-sm rounded-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#1e222b] text-slate-800 dark:text-slate-200 px-3 py-1.5 hover:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
              >
                <span id="modelName" class="truncate font-medium"></span>
                <svg
                  class="w-4 h-4 shrink-0 opacity-60"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>

              <ul
                id="modelList"
                role="listbox"
                class="hidden absolute right-0 mt-2 w-64 max-w-[calc(100vw-2rem)] max-h-80 overflow-y-auto z-50 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#171a21] shadow-lg py-1"
              ></ul>

              <!-- Sumber nilai model untuk send(), disembunyikan -->
              <select id="model" class="hidden" aria-hidden="true"></select>
            </div>

            <button
              id="theme"
              type="button"
              aria-label="Ganti tema"
              title="Ganti tema"
              class="rounded-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#1e222b] text-slate-700 dark:text-slate-200 p-2 hover:border-indigo-500 hover:text-indigo-500 transition"
            >
              <svg
                class="w-4 h-4 dark:hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
              <svg
                class="w-4 h-4 hidden dark:block"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
            </button>
          </div>
        </header>

        <main id="scroll" class="flex-1 overflow-y-auto px-4 py-6">
          <div id="chat" class="max-w-3xl mx-auto flex flex-col gap-5">
            <div
              id="empty"
              class="text-center text-slate-500 dark:text-slate-400 mt-[15vh]"
            >
              <h2
                class="text-slate-800 dark:text-slate-100 font-semibold text-lg mb-1"
              >
                Mulai percakapan
              </h2>
              <p>Ketik pesan di bawah, lalu tekan Enter.</p>
            </div>
          </div>
        </main>

        <footer class="px-3 sm:px-4 pb-3 pt-2 bg-slate-100 dark:bg-[#0f1115]">
          <form id="form" class="max-w-3xl mx-auto">
            <!-- Chip lampiran yang akan dikirim -->
            <div id="chips" class="flex flex-wrap gap-2 mb-2"></div>

            <!-- Satu kotak input: tombol 📎, textarea, dan Kirim. Juga area drop file -->
            <div
              id="dropzone"
              class="flex items-end gap-2 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#171a21] p-2 pl-3 shadow-sm focus-within:border-indigo-500 transition"
            >
              <button
                id="attach"
                type="button"
                aria-label="Lampirkan file"
                title="Lampirkan file"
                class="rounded-lg p-2 text-slate-500 hover:text-indigo-500 hover:bg-slate-100 dark:hover:bg-[#1e222b] transition"
              >
                📎
              </button>
              <input id="file" type="file" multiple class="hidden" />
              <textarea
                id="input"
                rows="1"
                placeholder="Tulis pesan..."
                class="flex-1 resize-none bg-transparent outline-none py-2 max-h-[200px] text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500"
              ></textarea>
              <button
                id="send"
                type="submit"
                class="rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 disabled:opacity-50 disabled:cursor-not-allowed transition"
              >
                Kirim
              </button>
            </div>
          </form>
          <p
            class="hidden md:block text-center text-xs text-slate-500 dark:text-slate-400 mt-1.5"
          >
            Enter untuk kirim, Shift+Enter untuk baris baru
          </p>
        </footer>
      </div>
    </div>

    <!-- Urutan penting: file yang dipakai lebih dulu harus dimuat lebih dulu -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/models.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/render.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/history.js"></script>
    <script src="/static/js/chat.js"></script>
  </body>
</html>
