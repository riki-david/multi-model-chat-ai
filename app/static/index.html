<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-Model Chat AI</title>

    <script>
      (function () {
        const saved = localStorage.getItem("theme");
        const dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script>
      tailwind.config = { darkMode: "class" };
    </script>

    <style>
      .md > *:first-child {
        margin-top: 0;
      }
      .md > *:last-child {
        margin-bottom: 0;
      }
      .md p {
        margin: 0.5rem 0;
      }
      .md h1,
      .md h2,
      .md h3 {
        font-weight: 600;
        margin: 1rem 0 0.5rem;
      }
      .md ul {
        list-style: disc;
        padding-left: 1.5rem;
        margin: 0.5rem 0;
      }
      .md ol {
        list-style: decimal;
        padding-left: 1.5rem;
        margin: 0.5rem 0;
      }
      .md a {
        color: #4f46e5;
        text-decoration: underline;
      }
      .dark .md a {
        color: #818cf8;
      }

      .md :not(pre) > code {
        background: #eef2f7;
        color: #be185d;
        padding: 2px 6px;
        border-radius: 6px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.9em;
      }
      .dark .md :not(pre) > code {
        background: #262b36;
        color: #f9a8d4;
      }

      .md pre {
        background: #1e293b;
        color: #e2e8f0;
        padding: 14px 16px;
        border-radius: 10px;
        overflow-x: auto;
        font-size: 13.5px;
        line-height: 1.5;
        margin: 0;
        border: 1px solid #334155;
      }
      .dark .md pre {
        background: #05070b;
        border-color: #3b4252;
      }
      .md pre code {
        font-family: ui-monospace, Consolas, monospace;
      }

      .md table {
        border-collapse: collapse;
        margin: 0.6rem 0;
        width: 100%;
        font-size: 14px;
      }
      .md th,
      .md td {
        border: 1px solid #cbd5e1;
        padding: 6px 10px;
        text-align: left;
      }
      .md th {
        background: #f1f5f9;
      }
      .dark .md th,
      .dark .md td {
        border-color: #3b4252;
      }
      .dark .md th {
        background: #232834;
      }
    </style>
  </head>

  <body
    class="h-full m-0 bg-slate-100 text-slate-800 dark:bg-[#0f1115] dark:text-slate-200 font-sans"
  >
    <div class="flex h-full">
      <!-- Sidebar riwayat -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-30 w-72 md:w-64 -translate-x-full md:translate-x-0 md:static flex flex-col bg-white dark:bg-[#171a21] border-r border-slate-200 dark:border-slate-800 transition-transform duration-200"
      >
        <div class="p-3">
          <button
            id="newChat"
            type="button"
            class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 transition"
          >
            + Chat baru
          </button>
        </div>
        <div
          class="px-4 pb-1 text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400"
        >
          Riwayat
        </div>
        <nav
          id="convList"
          class="flex-1 overflow-y-auto px-2 pb-3 space-y-0.5"
        ></nav>
      </aside>

      <div
        id="overlay"
        class="fixed inset-0 bg-black/40 z-20 hidden md:hidden"
      ></div>

      <div class="flex-1 flex flex-col min-w-0 h-full">
        <header
          class="flex items-center justify-between gap-3 px-4 py-3 bg-white dark:bg-[#171a21] border-b border-slate-200 dark:border-slate-800"
        >
          <div class="flex items-center gap-2 min-w-0">
            <button
              id="menuBtn"
              type="button"
              aria-label="Buka riwayat"
              class="md:hidden p-2 rounded-lg text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800"
            >
              <svg
                class="w-5 h-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M3 6h18M3 12h18M3 18h18" />
              </svg>
            </button>
            <h1 id="title" class="text-base font-semibold truncate">
              Chat baru
            </h1>
          </div>
          <div class="flex items-center gap-2">
            <select
              id="model"
              aria-label="Pilih model"
              class="text-sm rounded-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#1e222b] text-slate-800 dark:text-slate-200 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            ></select>
            <button
              id="theme"
              type="button"
              aria-label="Ganti tema"
              title="Ganti tema"
              class="rounded-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#1e222b] text-slate-700 dark:text-slate-200 p-2 hover:border-indigo-500 hover:text-indigo-500 transition"
            >
              <svg
                class="w-4 h-4 dark:hidden"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
              <svg
                class="w-4 h-4 hidden dark:block"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
            </button>
          </div>
        </header>

        <main id="scroll" class="flex-1 overflow-y-auto px-4 py-6">
          <div id="chat" class="max-w-3xl mx-auto flex flex-col gap-5">
            <div
              id="empty"
              class="text-center text-slate-500 dark:text-slate-400 mt-[15vh]"
            >
              <h2
                class="text-slate-800 dark:text-slate-100 font-semibold text-lg mb-1"
              >
                Mulai percakapan
              </h2>
              <p>Ketik pesan di bawah, lalu tekan Enter.</p>
            </div>
          </div>
        </main>

        <footer class="px-4 pb-4 pt-3 bg-slate-100 dark:bg-[#0f1115]">
          <form id="form" class="max-w-3xl mx-auto">
            <div
              class="flex items-end gap-2 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-[#171a21] p-2 pl-4 shadow-sm focus-within:border-indigo-500 transition"
            >
              <textarea
                id="input"
                rows="1"
                placeholder="Tulis pesan..."
                class="flex-1 resize-none bg-transparent outline-none py-2 max-h-[200px] text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-500"
              ></textarea>
              <button
                id="send"
                type="submit"
                class="rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 disabled:opacity-50 disabled:cursor-not-allowed transition"
              >
                Kirim
              </button>
            </div>
          </form>
          <p
            class="text-center text-xs text-slate-500 dark:text-slate-400 mt-2"
          >
            Enter untuk kirim, Shift+Enter untuk baris baru
          </p>
        </footer>
      </div>
    </div>

    <div
      id="toast"
      class="fixed bottom-28 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm px-4 py-2 rounded-lg opacity-0 transition-opacity pointer-events-none z-40"
    ></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const chat = $("chat"),
        scroll = $("scroll"),
        input = $("input"),
        sendBtn = $("send");
      const modelSel = $("model"),
        emptyEl = $("empty"),
        convList = $("convList");
      const titleEl = $("title"),
        sidebar = $("sidebar"),
        overlay = $("overlay");

      let currentId = null;
      let busy = false;

      // ---------- Tema ----------
      function applyTheme(dark) {
        document.documentElement.classList.toggle("dark", dark);
      }

      $("theme").addEventListener("click", () => {
        const dark = !document.documentElement.classList.contains("dark");
        applyTheme(dark);
        localStorage.setItem("theme", dark ? "dark" : "light");
      });

      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", (e) => {
          if (!localStorage.getItem("theme")) applyTheme(e.matches);
        });

      // ---------- Sidebar (mobile) ----------
      function setSidebar(open) {
        sidebar.classList.toggle("-translate-x-full", !open);
        overlay.classList.toggle("hidden", !open);
      }
      $("menuBtn").addEventListener("click", () =>
        setSidebar(sidebar.classList.contains("-translate-x-full")),
      );
      overlay.addEventListener("click", () => setSidebar(false));

      // ---------- Model ----------
      fetch("/api/models")
        .then((r) => r.json())
        .then((list) => {
          list.forEach((name) => modelSel.add(new Option(name, name)));
        });

      // ---------- Utilitas ----------
      const mathOpts = {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true },
        ],
        throwOnError: false,
      };

      function scrollDown() {
        scroll.scrollTop = scroll.scrollHeight;
      }

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.remove("opacity-0");
        t.classList.add("opacity-100");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => {
          t.classList.remove("opacity-100");
          t.classList.add("opacity-0");
        }, 1500);
      }

      async function copyText(text, btn) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        if (btn) {
          const old = btn.textContent;
          btn.textContent = "Tersalin";
          setTimeout(() => (btn.textContent = old), 1500);
        } else {
          toast("Tersalin");
        }
      }

      const BTN_SMALL =
        "text-xs px-2.5 py-1 rounded-md border border-slate-300 dark:border-slate-600 " +
        "bg-white dark:bg-[#252a35] text-slate-600 dark:text-slate-300 " +
        "hover:text-indigo-500 hover:border-indigo-500 transition";

      // ---------- Render pesan ----------
      function enhanceCodeBlocks(container) {
        container.querySelectorAll("pre").forEach((pre) => {
          if (pre.parentElement.classList.contains("relative")) return;
          const wrap = document.createElement("div");
          wrap.className = "relative my-2";
          pre.parentNode.insertBefore(wrap, pre);
          wrap.appendChild(pre);

          const btn = document.createElement("button");
          btn.className =
            "text-xs px-2.5 py-1 rounded-md absolute top-2 right-2 " +
            "bg-slate-700 text-slate-100 border border-slate-500 hover:bg-slate-600 transition";
          btn.textContent = "Salin";
          btn.onclick = () => copyText(pre.innerText, btn);
          wrap.appendChild(btn);
        });
      }

      function render(bubble, raw) {
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(raw));
        renderMathInElement(bubble, mathOpts);
        enhanceCodeBlocks(bubble);
      }

      function clearChat() {
        chat
          .querySelectorAll(":scope > div:not(#empty)")
          .forEach((m) => m.remove());
      }

      function addUserMsg(text) {
        emptyEl.style.display = "none";
        const wrap = document.createElement("div");
        wrap.className = "flex flex-col items-end max-w-[85%] self-end";
        wrap.innerHTML = `
    <div class="whitespace-pre-wrap break-words rounded-2xl rounded-br-md bg-indigo-600 text-white px-4 py-2.5 leading-relaxed shadow-sm"></div>`;
        wrap.querySelector(".rounded-2xl").textContent = text;
        chat.appendChild(wrap);
        scrollDown();
      }

      function addAiMsg(model) {
        emptyEl.style.display = "none";
        const wrap = document.createElement("div");
        wrap.className = "flex flex-col items-start w-full self-start";
        wrap.innerHTML = `
    <div class="text-xs text-slate-500 dark:text-slate-400 mb-1 px-1"></div>
    <div class="bubble md w-full rounded-2xl rounded-bl-md bg-white dark:bg-[#1e222b] border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 px-4 py-3 leading-relaxed break-words shadow-sm">
      <span class="inline-flex gap-1 py-1">
        <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce"></span>
        <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce [animation-delay:.15s]"></span>
        <span class="w-2 h-2 rounded-full bg-slate-400 animate-bounce [animation-delay:.3s]"></span>
      </span>
    </div>
    <div class="mt-1.5 flex gap-1.5"><button class="${BTN_SMALL}">Salin</button></div>`;
        wrap.querySelector(".text-xs").textContent = model || "";

        const bubble = wrap.querySelector(".bubble");
        const copyBtn = wrap.querySelector(":scope > div:last-child button");
        wrap.raw = "";
        copyBtn.onclick = () => copyText(wrap.raw, copyBtn);

        chat.appendChild(wrap);
        scrollDown();
        return { wrap, bubble };
      }

      // ---------- Riwayat / sidebar ----------
      const ITEM_BASE =
        "group flex items-center gap-2 rounded-lg px-3 py-2 text-sm cursor-pointer transition";

      function convItem(c) {
        const el = document.createElement("div");
        const active = c.id === currentId;
        el.className =
          ITEM_BASE +
          (active
            ? " bg-indigo-50 text-indigo-700 dark:bg-[#252a35] dark:text-indigo-300 font-medium"
            : " text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-[#1e222b]");

        el.innerHTML = `
    <span class="flex-1 truncate"></span>
    <button class="del shrink-0 p-1 rounded-md text-slate-400 hover:text-red-500 md:opacity-0 md:group-hover:opacity-100 transition"
      title="Hapus chat" aria-label="Hapus chat">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4h8v2m1 0v14H7V6h10"/>
      </svg>
    </button>`;
        el.querySelector("span").textContent = c.title;
        el.addEventListener("click", () => openConversation(c.id));
        el.querySelector(".del").addEventListener("click", (e) => {
          e.stopPropagation();
          deleteConversation(c.id);
        });
        return el;
      }

      async function loadList() {
        const list = await (await fetch("/api/conversations")).json();
        convList.innerHTML = "";
        list.forEach((c) => convList.appendChild(convItem(c)));

        const cur = list.find((c) => c.id === currentId);
        if (cur) titleEl.textContent = cur.title;
        return list;
      }

      async function openConversation(id) {
        if (busy) return;
        const res = await fetch(`/api/conversations/${id}`);
        if (!res.ok) {
          toast("Percakapan tidak ditemukan");
          return loadList();
        }
        const data = await res.json();

        currentId = id;
        clearChat();
        data.messages.forEach((m) => {
          if (m.role === "user") {
            addUserMsg(m.content);
          } else {
            const { wrap, bubble } = addAiMsg(m.model);
            wrap.raw = m.content;
            render(bubble, m.content);
          }
        });
        titleEl.textContent = data.title;
        if (!data.messages.length) emptyEl.style.display = "";
        scrollDown();
        setSidebar(false);
        await loadList();
      }

      function newChat() {
        if (busy) return;
        currentId = null;
        clearChat();
        emptyEl.style.display = "";
        titleEl.textContent = "Chat baru";
        setSidebar(false);
        loadList();
        input.focus();
      }

      async function deleteConversation(id) {
        if (busy) return;
        if (!confirm("Hapus chat ini? Tindakan ini tidak bisa dibatalkan."))
          return;
        await fetch(`/api/conversations/${id}`, { method: "DELETE" });
        toast("Chat dihapus");
        if (id === currentId) newChat();
        else loadList();
      }

      $("newChat").addEventListener("click", newChat);

      // ---------- Kirim pesan ----------
      async function send() {
        const msg = input.value.trim();
        if (!msg || busy) return;

        busy = true;
        sendBtn.disabled = true;
        input.value = "";
        autoResize();

        const model = modelSel.value;
        addUserMsg(msg);
        const { wrap, bubble } = addAiMsg(model);

        try {
          if (!currentId) {
            const r = await fetch("/api/conversations", { method: "POST" });
            currentId = (await r.json()).id;
          }

          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conv_id: currentId, message: msg, model }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${res.status}`);
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            wrap.raw += decoder.decode(value, { stream: true });
            render(bubble, wrap.raw);
            scrollDown();
          }
        } catch (e) {
          wrap.raw += `\n\n[Gagal: ${e.message || e}]`;
          render(bubble, wrap.raw);
        } finally {
          busy = false;
          sendBtn.disabled = false;
          input.focus();
          await loadList();
        }
      }

      // ---------- Input ----------
      function autoResize() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 200) + "px";
      }

      input.addEventListener("input", autoResize);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        send();
      });

      // ---------- Mulai ----------
      (async function init() {
        const list = await loadList();
        if (list.length) openConversation(list[0].id);
        else newChat();
      })();
    </script>
  </body>
</html>
